name: Build Miya ipa

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned ipa
        run: |
          set -e
          xcodebuild -project MiyaApp.xcodeproj \
            -target MiyaApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MiyaApp.app Payload/
          zip -q -r MiyaApp.ipa Payload

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: miya-ipa
          path: MiyaApp.ipa
          retention-days: 30
